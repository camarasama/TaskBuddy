name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          # Skip the postinstall prisma generate failing the install if engines differ
          PRISMA_SKIP_POSTINSTALL_GENERATE: "false"
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Security audit (allowlisted)
        # Fails on NEW moderate+ advisories; known dev/build-only ones are
        # allowlisted in ./audit-ci.jsonc (see security_assessment.md § Dependency Audit).
        run: npx --yes audit-ci@^7 --config ./audit-ci.jsonc
