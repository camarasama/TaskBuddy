# Run the backend on the app's own Node, not /usr/bin/node (v20, shared with GNFS).
# /opt/nodejs/lts is a symlink to the current LTS (Node 24 since 2026-10-27); an upgrade or a
# rollback moves that link, then `systemctl restart`. Install: sudo cp to
# /etc/systemd/system/taskbuddy-backend.service.d/, then `sudo systemctl daemon-reload`.
[Service]
ExecStart=
ExecStart=/opt/nodejs/lts/bin/node dist/index.js
