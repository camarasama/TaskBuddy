# Put the app's own Node first on PATH for `next start` (its #!/usr/bin/env node shebang).
# /opt/nodejs/lts is a symlink to the current LTS (Node 24 since 2026-10-27). Install: sudo cp to
# /etc/systemd/system/taskbuddy-frontend.service.d/, then `sudo systemctl daemon-reload`.
# The separate loopback.conf (binding to 127.0.0.1) is unchanged.
[Service]
Environment=PATH=/opt/nodejs/lts/bin:/usr/local/bin:/usr/bin:/bin
