# Apex marketing site for TaskBuddy — static files, no application server.
#
# Install:
#   sudo cp /opt/taskbuddy/app/deploy/nginx/gettaskbuddy.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/gettaskbuddy.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d gettaskbuddy.com -d www.gettaskbuddy.com
#
# certbot rewrites this file in place to add the TLS listeners and the :80 -> :443 redirect.
# This box also serves GNFS and the TaskBuddy app/api vhosts — do not edit those.

server {
    listen 80;
    listen [::]:80;
    server_name gettaskbuddy.com www.gettaskbuddy.com;

    root /var/www/taskbuddy-marketing;
    index index.html;

    # Send www to the canonical apex. Kept after `root` so certbot's ACME challenge, which it
    # serves from the webroot, still resolves on both names during issuance and renewal.
    if ($host = www.gettaskbuddy.com) {
        return 301 https://gettaskbuddy.com$request_uri;
    }

    # Clean URLs: /privacy -> privacy.html, and a plain 404 for anything that does not exist.
    # `.well-known/security.txt` is served straight from the webroot by this block, as a real file
    # rather than a rewrite, and nginx's mime.types gives it text/plain as RFC 9116 requires.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Static assets are content-hashed by nothing here, so keep the cache short enough that a
    # copy-deploy is visible quickly.
    #
    # ⚠️ The security headers are REPEATED in here, and that is not redundancy. nginx's `add_header`
    # does not inherit into a block that declares its own: one `add_header Cache-Control` at this
    # level silently drops every header set on the server block. Before this, css/js/png responses
    # from the apex carried no CSP, no nosniff, no Referrer-Policy and no X-Frame-Options at all.
    # If you add a header below, add it here too, or it will not apply to static assets.
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # This site is fully self-contained: no external scripts, styles, fonts or images.
    #
    # HSTS starts at one day on purpose. It is a promise the browser keeps even when the site is
    # broken: if TLS ever fails, nobody can reach the site until the max-age expires, and it cannot
    # be cleared centrally. One day keeps a certificate mishap recoverable. Ramp it only once this
    # has been live and uneventful: 1 day, then a week, then 180 days to match `api.`.
    #
    # No `includeSubDomains`: at the apex that would bind app. and api. as well, plus any subdomain
    # created later, to HTTPS-only. Both already send their own HSTS, so this buys nothing and
    # commits future hosts on their behalf. No `preload` either, which is hard to undo.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    access_log /var/log/nginx/taskbuddy-marketing.access.log;
    error_log  /var/log/nginx/taskbuddy-marketing.error.log;
}
