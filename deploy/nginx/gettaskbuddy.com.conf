# Apex marketing site for TaskBuddy — static files, no application server.
#
# Install:
#   sudo cp /opt/taskbuddy/app/deploy/nginx/gettaskbuddy.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/gettaskbuddy.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d gettaskbuddy.com -d www.gettaskbuddy.com
#
# certbot rewrites this file in place to add the TLS listeners and the :80 -> :443 redirect.
# This box also serves GNFS and the TaskBuddy app/api vhosts — do not edit those.

server {
    listen 80;
    listen [::]:80;
    server_name gettaskbuddy.com www.gettaskbuddy.com;

    root /var/www/taskbuddy-marketing;
    index index.html;

    # Send www to the canonical apex. Kept after `root` so certbot's ACME challenge, which it
    # serves from the webroot, still resolves on both names during issuance and renewal.
    if ($host = www.gettaskbuddy.com) {
        return 301 https://gettaskbuddy.com$request_uri;
    }

    # Clean URLs: /privacy -> privacy.html. Falls through to 404 when the page does not exist,
    # which is the correct behaviour while the legal pages are withheld pending legal review.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Static assets are content-hashed by nothing here, so keep the cache short enough that a
    # copy-deploy is visible quickly.
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # This site is fully self-contained: no external scripts, styles, fonts or images.
    add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    access_log /var/log/nginx/taskbuddy-marketing.access.log;
    error_log  /var/log/nginx/taskbuddy-marketing.error.log;
}
